apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: community
  namespace: travel-planner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: community
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # 지금 ASG target tracking과 동일한 기준값
