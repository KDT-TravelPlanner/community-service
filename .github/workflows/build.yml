name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - develop
      - "codex/**"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew clean build
