name: Community Main Release (Dev)

# 모놀리스의 Main Release 흐름을 Community 서비스에 맞게 적용한다.
# main 커밋은 검증(build.yml)을 먼저 통과해야만 ECR publish가 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: community-main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Community Release
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish Community Image
    needs: verify
    uses: ./.github/workflows/publish-ecr.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write

  # SCRUM-144: gitops 갱신은 travel-gitops 레포의 공용 workflow가 담당하고, 여기서는 호출만 한다.
  # 공용 workflow는 서비스 CI 안에서 실행되므로, travel-gitops 쓰기는 조직 Secret의
  # GitHub App(kdt-travelplanner-gitops-bot) 인증으로 한다. 필요한 두 Secret만 명시적으로 넘긴다.
  update-gitops:
    name: Update GitOps repo
    needs: publish
    uses: KDT-TravelPlanner/travel-gitops/.github/workflows/update-gitops.yml@main
    secrets:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
    with:
      service-name: community
      image-ref: ${{ needs.publish.outputs.image_ref }}
      deployment-patch-path: k8s/overlays/dev-eks/workload/community/deployment.patch.yaml

  release-summary:
    name: Release Summary
    needs: [verify, publish, update-gitops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write release summary
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          UPDATE_GITOPS_RESULT: ${{ needs.update-gitops.result }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          {
            echo "### Community release result"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Verification | ${VERIFY_RESULT} |"
            echo "| ECR image publish | ${PUBLISH_RESULT} |"
            echo "| GitOps image update PR | ${UPDATE_GITOPS_RESULT} |"
            if [[ "${PUBLISH_RESULT}" == "success" ]]; then
              echo
              echo "Published image: \`${IMAGE_REF}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
