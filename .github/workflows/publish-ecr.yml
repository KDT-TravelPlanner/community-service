name: Community ECR Publish (Dev)

# release-main-dev.yml의 검증 gate를 통과한 main 커밋만 dev ECR에 publish한다.
on:
  workflow_call:
    outputs:
      image_ref:
        description: "Published immutable Community image reference (repository@sha256:...)"
        value: ${{ jobs.publish.outputs.image_ref }}

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: community-ecr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # travel-gitops SCRUM-125 Terraform output을 GitHub Environment dev에 등록한 뒤 실행된다.
    # 모놀리스와 동일하게 Environment 값을 job 안에서 사용한다. 값이 누락되면
    # OIDC/ECR 단계가 명확히 실패하므로 설정 문제를 skip으로 숨기지 않는다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Dockerfile은 단일 runner stage라, 이미지 빌드 전에 JAR를 만든다.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build deployable JAR
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      # 장기 AWS Access Key를 저장하지 않는다. GitHub OIDC 토큰으로 Community 전용 push Role만 assume한다.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: community-ecr-${{ github.run_id }}

      - name: Sign in to ECR
        run: |
          set -euo pipefail
          registry="${{ vars.ECR_REPOSITORY_URL }}"
          registry="${registry%%/*}"
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${registry}"

      # EKS worker node의 CPU 아키텍처와 맞춘 이미지를 만들고, Actions cache로
      # Gradle 산출물 이후 Docker 레이어를 재사용한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포 기준은 태그가 아니라 ECR에 실제 저장된 immutable digest다.
      - name: Resolve published image digest
        id: digest
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          repository_name="${REPOSITORY_URL##*/}"
          image_digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${repository_name}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "${image_digest}"
          test "${image_digest}" != "None"
          image_ref="${REPOSITORY_URL}@${image_digest}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "### Published Community image" >> "${GITHUB_STEP_SUMMARY}"
          echo "${image_ref}" >> "${GITHUB_STEP_SUMMARY}"

      # GitOps PR 생성은 travel-gitops 쓰기 권한(GitHub App 또는 fine-grained token) 정책을
      # 확정한 뒤 별도 workflow 단계로 연결한다. 현재는 digest를 Summary/Job output으로 남긴다.
