spring:
  application:
    name: travel-planner-community
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_diary_dev}
    username: ${SPRING_DATASOURCE_USERNAME:travel_diary}
    password: ${SPRING_DATASOURCE_PASSWORD:travel_diary_password}
    hikari:
      # hibernate.default_schema는 Hibernate가 만드는 SQL(JPQL 기반 쿼리, DDL 검증)에만 적용되고,
      # @Query(nativeQuery = true)로 직접 쓴 SQL이나 JdbcTemplate 같은 raw JDBC 호출에는 전혀
      # 영향을 주지 않는다 — 이 프로젝트는 조회수/좋아요/마이페이지 등 상당수가 네이티브 쿼리라
      # search_path 자체를 커넥션 레벨에서 고정해야 "relation does not exist"가 나지 않는다.
      connection-init-sql: SET search_path TO community
  flyway:
    schemas: community
    default-schema: community
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        default_schema: community
  lifecycle:
    timeout-per-shutdown-phase: 20s
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/v1/**
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: false
    disable-swagger-default-url: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

app:
  services:
    identity:
      base-url: ${IDENTITY_BASE_URL:http://identity:8080}
    travel:
      base-url: ${TRAVEL_BASE_URL:http://travel:8080}
  logging:
    error-frame-limit: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:identity-service}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

logging:
  level:
    root: "WARN"
    com.ktcloud.travelplanner.global.logging.ApplicationLogger: "INFO"
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.security: "WARN"
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: "OFF"
    org.springframework.web.filter.CommonsRequestLoggingFilter: "OFF"
    org.apache.coyote.http11.Http11InputBuffer: "OFF"
    org.apache.hc.client5.http.wire: "OFF"
    org.apache.http.wire: "OFF"
    reactor.netty.http.client: "OFF"
  structured:
    json:
      include: "@timestamp,ecs,ecs.version,log,log.level,log.logger,process,process.pid,process.thread,process.thread.name,service,service.name,service.environment,message,event,requestId,method,route,status,durationMs,outcome,errorCode,errorType,errorFingerprint,errorFrames"
